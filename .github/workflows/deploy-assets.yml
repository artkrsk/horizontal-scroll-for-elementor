name: Deploy Assets to WordPress.org

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the changes without committing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-assets:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/deploy-assets.yml@main
    with:
      plugin_slug: 'horizontal-scroll-for-elementor'
      dry_run: ${{ inputs.dry_run }}
      blueprint_check: true
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
